version: 2
updates:
  # Minor and patch updates are grouped into one PR per package each week; majors come one by one
  - package-ecosystem: npm
    directory: /server
    schedule:
      interval: weekly
    groups:
      server-minor:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /client
    schedule:
      interval: weekly
    groups:
      client-minor:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: docker
    directories: [/server, /client]
    schedule:
      interval: monthly

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
